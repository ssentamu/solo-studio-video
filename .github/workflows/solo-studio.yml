name: Solo Studio checks

on:
  push:
  pull_request:

concurrency:
  group: solo-studio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile application and tests
        run: python -m py_compile api.py auth_store.py audio_generation.py job_store.py media_assembly.py worker.py pipeline.py engines/*.py tests/*.py
      - name: Validate deployment shell
        run: bash -n deploy-traefik.sh
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check patch whitespace
        run: git diff --check
