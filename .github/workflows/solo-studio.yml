name: Solo Studio checks

on:
  push:
  pull_request:

concurrency:
  group: solo-studio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install media verification tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile application and tests
        run: python -m py_compile api.py auth_store.py audio_generation.py job_store.py media_assembly.py worker.py pipeline.py engines/*.py tests/*.py
      - name: Validate deployment shell
        run: bash -n deploy-traefik.sh
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check patch whitespace
        run: git diff --check

  container-smoke:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build exact release image
        run: docker build --pull=false --tag solo-studio-video:${{ github.sha }} .
      - name: Smoke exact image without network or credentials
        run: |
          docker run --rm --network none --env SOLO_STUDIO_REQUIRE_API_TOKEN=0 --entrypoint sh solo-studio-video:${{ github.sha }} -ceu '
            command -v ffmpeg >/dev/null
            command -v ffprobe >/dev/null
            command -v higgsfield >/dev/null
            python -m py_compile api.py auth_store.py audio_generation.py job_store.py media_assembly.py music_generation.py package_utils.py pipeline.py provider_canary.py runtime_init.py worker.py engines/*.py
            python -c "import api, audio_generation, job_store, media_assembly, music_generation, package_utils, pipeline, provider_canary, worker"
            python provider_canary.py > /tmp/provider-canary.json
            python -c "import json; from pathlib import Path; report=json.loads(Path(\"/tmp/provider-canary.json\").read_text()); print(json.dumps(report, sort_keys=True)); assert report[\"live\"] is False; assert report[\"network_called\"] is False; assert report[\"status\"] == \"dry_run\"; print(\"CONTAINER_SMOKE=PASS\")"
          '
